---
title: 网址导航
layout: false
---
<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>网址导航</title>
  <meta name="description" content="个人收藏夹整理而成的静态网址导航，数据与页面分离，可直接编辑 data/sites.js 维护。">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23c2855b'/%3E%3Ctext x='16' y='23' font-size='19' font-family='serif' text-anchor='middle' fill='%23fff'%3E%E2%86%92%3C/text%3E%3C/svg%3E">
  <link rel="preload" href="assets/style.css" as="style">
  <script>
  (function(){try{var t=localStorage.getItem('theme');if(t)document.documentElement.setAttribute('data-theme',t);}catch(e){}})();
  </script>
  <link rel="stylesheet" href="assets/style.css">
</head>
<body>
  <a href="#main" class="skip-link">跳到主要内容</a>

  <header class="site-header">
    <div class="header-inner">
      <div class="brand">
        <a class="site-title" href="./">~/nav</a>
        <p class="site-subtitle" id="subtitle">加载中…</p>
      </div>

      <div class="header-actions">
        <div class="search-box">
          <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <circle cx="11" cy="11" r="7"></circle>
            <line x1="16.5" y1="16.5" x2="21" y2="21"></line>
          </svg>
          <input id="search" type="search" placeholder="搜索标题、网址或标签…（按 / 聚焦）"
                 autocomplete="off" spellcheck="false" aria-label="搜索网址">
          <button id="clearSearch" class="clear-btn" type="button" aria-label="清空搜索" hidden>×</button>
        </div>
        <button id="themeToggle" class="theme-toggle" type="button" aria-label="切换明暗主题" title="切换明暗主题">&#9789;</button>
      </div>
    </div>
  </header>

  <div class="layout">
    <aside class="sidebar" id="sidebar">
      <nav class="cat-nav" aria-label="分类导航">
        <h2 class="sidebar-title">分类</h2>
        <ul class="cat-list" id="catList"></ul>
      </nav>
    </aside>

    <main id="main" class="main">
      <div class="toolbar">
        <div class="tag-bar" id="tagBar" aria-label="标签筛选"></div>
        <p class="result-count" id="resultCount" aria-live="polite"></p>
      </div>
      <div id="content" class="content"></div>
      <p class="empty-state" id="emptyState" hidden>没有匹配的网址，换个关键词试试。</p>
    </main>
  </div>

  <footer class="site-footer">
    <p>共 <span id="totalCount">0</span> 条网址 ·
       更新于 <span id="updatedAt">—</span></p>
  </footer>

  <script src="data/sites.js"></script>
  <script src="assets/app.js"></script>
</body>
</html>
