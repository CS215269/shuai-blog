# LaTeX Minimal Theme Configuration

# Top navigation (rendered in header.njk)
nav:
  - label: 首页
    url: /
  - label: 关于
    url: /about/
  - label: 作品集
    url: /projects/
  - label: 标签
    url: /tags/

# Site header
header:
  title: ~/blog

# Home page links (displayed on index)
links:
  - name: GitHub
    url: https://github.com/CS215269
    icon: github
  - name: Email
    url: mailto:chenshuai.dev@qq.com
    icon: email
  - name: 个人网站
    url: https://shuai-blog.pages.dev/
    icon: rss
  - name: RSS
    url: /atom.xml
    icon: rss

# Article page
article:
  toc: true                # Show table of contents
  toc_collapse: true       # Collapse sub-items on desktop

# Dark mode
dark_mode_default: true    # Dark mode as default

